<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToyOrders - Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="card">
        <h1>Login</h1>

        <label for="user">User</label>
        <input type="text" id="user">

        <label for="password">Password</label>
        <input type="password" id="password">

        <p id="message" class="message"></p>

        <div class="buttons">
            <button class="secondary" onclick="goTo('index.html')">Back to home</button>
            <button onclick="login()">Go to operations menu</button>
        </div>
    </div>
</body>
</html>
