<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToyOrders - New order</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="card">
        <h1>New order</h1>

        <form id="orderForm" onsubmit="sendOrder(event)">
            <label for="id">Order ID</label>
            <input type="text" id="id" name="id" required>

            <label for="name">Customer full name</label>
            <input type="text" id="name" name="name" required>

            <label for="address">Address</label>
            <input type="text" id="address" name="address" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" required>

            <h2>Products</h2>
            <div class="product">
                <label><input type="checkbox" onchange="changeProduct(this, 'product1')"> Building blocks set - 34.99 €</label>
                <input type="number" id="product1" name="product1" min="1" placeholder="Qty" disabled>
            </div>
            <div class="product">
                <label><input type="checkbox" onchange="changeProduct(this, 'product2')"> Teddy bear - 19.95 €</label>
                <input type="number" id="product2" name="product2" min="1" placeholder="Qty" disabled>
            </div>
            <div class="product">
                <label><input type="checkbox" onchange="changeProduct(this, 'product3')"> Remote control car - 45.00 €</label>
                <input type="number" id="product3" name="product3" min="1" placeholder="Qty" disabled>
            </div>
            <div class="product">
                <label><input type="checkbox" onchange="changeProduct(this, 'product4')"> Family board game - 24.90 €</label>
                <input type="number" id="product4" name="product4" min="1" placeholder="Qty" disabled>
            </div>
            <p class="note">Prices without VAT.</p>

            <div class="buttons">
                <button type="submit">Send order</button>
            </div>
        </form>

        <p id="result" class="result"></p>

        <div class="buttons">
            <button class="secondary" onclick="goTo('index.html')">Back to home</button>
            <button onclick="goTo('menu.html')">Back to operations menu</button>
        </div>
    </div>
</body>
</html>
